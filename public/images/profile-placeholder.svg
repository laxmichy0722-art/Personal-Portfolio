<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 1000"
  width="800"
  height="1000"
  role="img"
  aria-label="Placeholder portrait — replace with Laxmi Chaudhary's photograph"
>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe9e4" />
      <stop offset="55%" stop-color="#e4dcd5" />
      <stop offset="100%" stop-color="#d8cec6" />
    </linearGradient>
    <linearGradient id="figure" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#8d8177" />
      <stop offset="100%" stop-color="#6b6058" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="800" height="1000" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="1000" fill="url(#backdrop)" />
    <circle cx="400" cy="330" r="300" fill="url(#glow)" />

    <!-- Head -->
    <ellipse cx="400" cy="352" rx="132" ry="158" fill="url(#figure)" />
    <!-- Shoulders -->
    <path
      d="M400 566c-150 0-262 92-282 224-6 40-8 76-8 122 0 30 4 60 4 88h572c0-28 4-58 4-88 0-46-2-82-8-122-20-132-132-224-282-224Z"
      fill="url(#figure)"
    />
  </g>

  <!-- Monogram -->
  <text
    x="400"
    y="930"
    text-anchor="middle"
    font-family="ui-monospace, 'SF Mono', Menlo, monospace"
    font-size="30"
    letter-spacing="14"
    fill="#3d362f"
    fill-opacity="0.55"
  >
    LC
  </text>
</svg>