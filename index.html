<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- ---------------------------------------------------------------- SEO -->
    <title>YOUR NAME — Graphic, Web &amp; UI/UX Designer</title>
    <meta
      name="description"
      content="Independent creative designer building brand identities, graphic design, UI/UX and modern websites. Turn your idea into a visual identity and a working digital experience."
    />
    <meta name="author" content="YOUR NAME" />
    <meta
      name="keywords"
      content="graphic designer, web designer, UI UX designer, brand identity designer, creative developer, freelance designer"
    />
    <link rel="canonical" href="https://example.com/" />

    <!-- ------------------------------------------------------------ Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YOUR NAME" />
    <meta property="og:title" content="YOUR NAME — Graphic, Web &amp; UI/UX Designer" />
    <meta
      property="og:description"
      content="Graphic design meets digital experiences. I transform ideas into powerful visual identities, meaningful designs, and modern websites."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YOUR NAME — Graphic, Web &amp; UI/UX Designer" />
    <meta
      name="twitter:description"
      content="Graphic design meets digital experiences. Brand identities, graphic design, UI/UX and modern websites."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- ------------------------------------------------------------- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- --------------------------------------------------------------- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "YOUR NAME",
        "jobTitle": "Graphic Designer, Web Designer, UI/UX Designer",
        "description": "Independent creative designer specialising in brand identity, graphic design, UI/UX and web development.",
        "email": "mailto:hello@example.com",
        "url": "https://example.com/"
      }
    </script>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #fff; background: #0a0a0a">

          This portfolio uses JavaScript for its interactive sections. Please
          enable JavaScript, or email <a href="mailto:hello@example.com">hello@example.com</a>.

    <script type="module" src="/src/main.tsx"></script>
